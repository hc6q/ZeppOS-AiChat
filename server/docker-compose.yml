services:
  app:
    image: ai-chat-backend:local
    build: .
    network_mode: host
    volumes:
      - ./data:/app/data

  handler:
    image: ai-chat-backend:local
    entrypoint: python -m ai_chat_handler
    network_mode: host
    volumes:
      - ./data:/app/data

  redis:
    image: redis:7-alpine
    restart: always
    network_mode: host
    volumes:
      - ./data/redis:/data
